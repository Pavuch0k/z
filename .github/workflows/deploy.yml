name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install marked

      - name: Build documentation
        shell: bash
        run: |
          set -e

          rm -rf _site
          mkdir -p _site

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const { marked } = require("marked");

          const docsDir = path.resolve("docs");
          const siteDir = path.resolve("_site");

          function getMarkdownFiles(dir) {
            const result = [];

            for (const entry of fs.readdirSync(dir, {
              withFileTypes: true
            })) {
              const fullPath = path.join(dir, entry.name);

              if (entry.isDirectory()) {
                result.push(...getMarkdownFiles(fullPath));
              } else if (
                entry.isFile() &&
                entry.name.toLowerCase().endsWith(".md")
              ) {
                result.push(fullPath);
              }
            }

            return result;
          }

          function getTitle(markdown, filePath) {
            const match = markdown.match(/^#\s+(.+)$/m);

            if (match) {
              return match[1].trim();
            }

            return path.basename(filePath, ".md");
          }

          /*
           * Исправление Markdown-ссылок:
           *
           * [Спецификация](01-specification.md)
           *                    ↓
           * [Спецификация](01-specification.html)
           *
           * Также:
           *
           * [Типы](01-specification.md#types)
           *       ↓
           * [Типы](01-specification.html#types)
           */
          function fixMarkdownLinks(markdown) {
            return markdown.replace(
              /(\]\()((?:\.\/)?[^)\s#]+)\.md(#[^)\s]*)?(\))/gi,
              (match, prefix, file, hash = "", suffix) => {
                return `${prefix}${file}.html${hash}${suffix}`;
              }
            );
          }

          /*
           * Дополнительное исправление уже готового HTML.
           *
           * Это главная защита от ситуации, когда marked
           * каким-либо образом оставил .md в href.
           *
           * href="01-specification.md"
           *        ↓
           * href="01-specification.html"
           */
          function fixHtmlLinks(html) {
            return html.replace(
              /href="([^"]+?)\.md(#[^"]*)?"/gi,
              (match, file, hash = "") => {
                return `href="${file}.html${hash}"`;
              }
            );
          }

          function escapeHtml(text) {
            return text
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
          }

          function relativeUrl(fromFile, targetFile) {
            const relative = path.relative(
              path.dirname(fromFile),
              targetFile
            );

            return relative.split(path.sep).join("/");
          }

          const markdownFiles = getMarkdownFiles(docsDir);

          const pages = markdownFiles
            .map(file => {
              const relative = path.relative(docsDir, file);

              const relativeHtml = relative.replace(
                /\.md$/i,
                ".html"
              );

              return {
                source: file,
                relative,
                output: path.join(siteDir, relativeHtml),
                title: getTitle(
                  fs.readFileSync(file, "utf8"),
                  file
                )
              };
            })
            .sort((a, b) =>
              a.relative.localeCompare(
                b.relative,
                undefined,
                {
                  numeric: true,
                  sensitivity: "base"
                }
              )
            );

          console.log("");
          console.log("=== Documentation pages ===");

          for (const page of pages) {
            console.log(
              `${page.relative} -> ${path.relative(
                siteDir,
                page.output
              )}`
            );
          }

          const navigation = pages
            .filter(page => page.relative !== "index.md")
            .map(page => {
              const href = relativeUrl(
                path.join(siteDir, "index.html"),
                page.output
              );

              return `
                <li>
                  <a href="${href}">
                    ${escapeHtml(page.title)}
                  </a>
                </li>
              `;
            })
            .join("");

          const css = `
            * {
              box-sizing: border-box;
            }

            html {
              color-scheme: dark;
            }

            body {
              margin: 0;
              font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Helvetica,
                Arial,
                sans-serif;
              background: #0d1117;
              color: #e6edf3;
              line-height: 1.6;
            }

            a {
              color: #58a6ff;
              text-decoration: none;
            }

            a:hover {
              text-decoration: underline;
            }

            .layout {
              display: flex;
              min-height: 100vh;
            }

            aside {
              width: 280px;
              flex-shrink: 0;
              padding: 24px;
              border-right: 1px solid #30363d;
              background: #161b22;
              position: sticky;
              top: 0;
              height: 100vh;
              overflow-y: auto;
            }

            aside h2 {
              margin-top: 0;
              font-size: 20px;
            }

            aside ul {
              list-style: none;
              padding: 0;
            }

            aside li {
              margin: 8px 0;
            }

            main {
              width: 100%;
              max-width: 1000px;
              padding: 48px;
            }

            main img {
              max-width: 100%;
            }

            main pre {
              overflow-x: auto;
              padding: 16px;
              border-radius: 8px;
              background: #161b22;
              border: 1px solid #30363d;
            }

            main code {
              font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;
            }

            main :not(pre) > code {
              padding: 2px 5px;
              border-radius: 4px;
              background: #161b22;
            }

            main blockquote {
              margin-left: 0;
              padding-left: 16px;
              border-left: 4px solid #30363d;
              color: #8b949e;
            }

            table {
              border-collapse: collapse;
              width: 100%;
            }

            th,
            td {
              padding: 8px 12px;
              border: 1px solid #30363d;
            }

            th {
              background: #161b22;
            }

            @media (max-width: 800px) {
              .layout {
                display: block;
              }

              aside {
                width: 100%;
                height: auto;
                position: static;
                border-right: 0;
                border-bottom: 1px solid #30363d;
              }

              main {
                padding: 24px;
              }
            }
          `;

          function makeDocument(title, content) {
            return `<!doctype html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <meta
              name="viewport"
              content="width=device-width, initial-scale=1"
            >
            <title>${escapeHtml(title)} — Z</title>
            <style>${css}</style>
          </head>

          <body>
            <div class="layout">

              <aside>
                <h2>Z</h2>

                <nav>
                  <ul>
                    <li>
                      <a href="index.html">Главная</a>
                    </li>

                    ${navigation}
                  </ul>
                </nav>
              </aside>

              <main>
                ${content}
              </main>

            </div>
          </body>
          </html>`;
          }

          for (const page of pages) {
            console.log("");
            console.log(`Building: ${page.relative}`);

            const markdown = fs.readFileSync(
              page.source,
              "utf8"
            );

            /*
             * Шаг 1:
             * исправляем ссылки в Markdown
             */
            const fixedMarkdown =
              fixMarkdownLinks(markdown);

            /*
             * Шаг 2:
             * Markdown -> HTML
             */
            let html = marked.parse(
              fixedMarkdown
            );

            /*
             * Шаг 3:
             * гарантированно убираем оставшиеся .md
             * из href уже готового HTML
             */
            html = fixHtmlLinks(html);

            /*
             * Проверка.
             * Если .md всё ещё остался в ссылках,
             * сборка падает.
             */
            const brokenMdLinks =
              html.match(/href="[^"]+\.md(?:#[^"]*)?"/gi);

            if (brokenMdLinks) {
              console.error(
                "ERROR: Markdown links remain in generated HTML:"
              );

              console.error(
                brokenMdLinks
              );

              process.exit(1);
            }

            let output = page.output;

            /*
             * docs/index.md
             *       ↓
             * _site/index.html
             */
            if (page.relative === "index.md") {
              output = path.join(
                siteDir,
                "index.html"
              );
            }

            fs.mkdirSync(
              path.dirname(output),
              {
                recursive: true
              }
            );

            fs.writeFileSync(
              output,
              makeDocument(
                page.title,
                html
              ),
              "utf8"
            );

            console.log(
              `Generated: ${path.relative(
                siteDir,
                output
              )}`
            );
          }

          /*
           * GitHub Pages
           */
          fs.writeFileSync(
            path.join(siteDir, ".nojekyll"),
            "",
            "utf8"
          );

          /*
           * Показываем итоговые HTML-файлы
           */
          console.log("");
          console.log(
            "=== Generated files ==="
          );

          function getAllFiles(dir) {
            const result = [];

            for (const entry of fs.readdirSync(
              dir,
              {
                withFileTypes: true
              }
            )) {
              const fullPath = path.join(
                dir,
                entry.name
              );

              if (entry.isDirectory()) {
                result.push(
                  ...getAllFiles(fullPath)
                );
              } else {
                result.push(fullPath);
              }
            }

            return result;
          }

          for (const file of getAllFiles(
            siteDir
          )) {
            console.log(
              path.relative(
                siteDir,
                file
              )
            );
          }

          /*
           * Финальная проверка всего сайта.
           *
           * Если где-нибудь осталась ссылка
           * на .md — GitHub Actions завершится
           * с ошибкой вместо публикации сломанной версии.
           */
          for (const file of getAllFiles(
            siteDir
          )) {
            if (!file.endsWith(".html")) {
              continue;
            }

            const content =
              fs.readFileSync(
                file,
                "utf8"
              );

            if (
              /href="[^"]+\.md(?:#[^"]*)?"/i.test(
                content
              )
            ) {
              console.error(
                `ERROR: Found .md link in ${file}`
              );

              process.exit(1);
            }
          }

          console.log("");
          console.log(
            "Documentation build completed successfully."
          );
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4