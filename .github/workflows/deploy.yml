name: Deploy Docs to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build documentation
        run: |
          mkdir -p _site

          npm install marked

          cat > compiler.js <<'EOF'
          const fs = require("fs");
          const path = require("path");
          const { marked } = require("marked");

          const DOCS_DIR = "docs";
          const SITE_DIR = "_site";

          marked.setOptions({
            gfm: true,
            breaks: true
          });

          // -----------------------------------------
          // Find all Markdown files
          // -----------------------------------------

          function findMarkdownFiles(dir) {
            if (!fs.existsSync(dir)) {
              return [];
            }

            const result = [];

            for (const entry of fs.readdirSync(dir, {
              withFileTypes: true
            })) {
              const fullPath = path.join(dir, entry.name);

              if (entry.isDirectory()) {
                result.push(...findMarkdownFiles(fullPath));
              } else if (
                entry.isFile() &&
                entry.name.toLowerCase().endsWith(".md")
              ) {
                result.push(fullPath);
              }
            }

            return result;
          }

          // -----------------------------------------
          // Helpers
          // -----------------------------------------

          function getTitle(markdown, filePath) {
            const match = markdown.match(/^#\s+(.+)$/m);

            if (match) {
              return match[1].trim();
            }

            return path.basename(filePath, ".md");
          }

          function getSlug(filePath) {
            const relative = path.relative(DOCS_DIR, filePath);

            return relative
              .replace(/\.md$/i, "")
              .split(path.sep)
              .map(part =>
                part
                  .toLowerCase()
                  .replace(/[^a-z0-9а-яё_-]+/gi, "-")
                  .replace(/^-+|-+$/g, "")
              )
              .join("/");
          }

          function getOutputPath(filePath) {
            const relative = path.relative(DOCS_DIR, filePath);

            return path.join(
              SITE_DIR,
              relative.replace(/\.md$/i, ".html")
            );
          }

          function escapeHtml(value) {
            return value
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;");
          }

          // -----------------------------------------
          // FIX: Markdown links .md -> .html
          // -----------------------------------------

          function fixMarkdownLinks(markdown) {
            return markdown.replace(
              /(\]\()((?:\.\/)?[^)\s#]+)\.md(#[^)\s]*)?(\))/gi,
              (match, prefix, file, hash = "", suffix) => {
                return `${prefix}${file}.html${hash}${suffix}`;
              }
            );
          }

          // -----------------------------------------
          // FIX: HTML links .md -> .html
          // -----------------------------------------

          function fixHtmlLinks(html) {
            return html.replace(
              /href="([^"]+?)\.md(#[^"]*)?"/gi,
              (match, file, hash = "") => {
                return `href="${file}.html${hash}"`;
              }
            );
          }

          // -----------------------------------------
          // Discover documentation
          // -----------------------------------------

          const markdownFiles = findMarkdownFiles(DOCS_DIR);

          if (markdownFiles.length === 0) {
            console.error("No Markdown files found in docs/");
            process.exit(1);
          }

          const pages = markdownFiles.map(filePath => {
            const markdown = fs.readFileSync(filePath, "utf8");

            return {
              source: filePath,
              title: getTitle(markdown, filePath),
              slug: getSlug(filePath),
              output: getOutputPath(filePath),
              relative: path.relative(DOCS_DIR, filePath)
            };
          });

          // Natural ordering
          pages.sort((a, b) =>
            a.relative.localeCompare(b.relative, undefined, {
              numeric: true,
              sensitivity: "base"
            })
          );

          console.log("");
          console.log("Documentation pages:");

          for (const page of pages) {
            console.log(`- ${page.relative} -> ${page.output}`);
          }

          console.log("");

          // -----------------------------------------
          // Navigation
          // -----------------------------------------

          function createNavigation(currentPage) {
            return pages
              .map(page => {
                const active =
                  page.source === currentPage.source
                    ? " class=\"active\""
                    : "";

                const href =
                  path.relative(
                    path.dirname(currentPage.output),
                    page.output
                  ).replace(/\\/g, "/");

                return `
                  <li${active}>
                    <a href="${href}">${escapeHtml(page.title)}</a>
                  </li>
                `;
              })
              .join("");
          }

          // -----------------------------------------
          // HTML page
          // -----------------------------------------

          function createPage(title, content, currentPage) {
            const navigation = createNavigation(currentPage);

            return `<!DOCTYPE html>
          <html lang="ru">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport"
                  content="width=device-width, initial-scale=1.0">

            <title>${escapeHtml(title)}</title>

            <style>
              * {
                box-sizing: border-box;
              }

              body {
                font-family:
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  "Noto Sans",
                  Helvetica,
                  Arial,
                  sans-serif;

                margin: 0;
                padding: 0;

                background: #0d1117;
                color: #c9d1d9;

                line-height: 1.5;
              }

              .container {
                max-width: 1280px;
                margin: 0 auto;

                display: flex;

                min-height: 100vh;

                padding: 24px;
                gap: 24px;
              }

              .sidebar {
                width: 280px;

                background: #161b22;

                padding: 24px;

                border-radius: 6px;
                border: 1px solid #30363d;

                height: fit-content;

                position: sticky;
                top: 24px;
              }

              .sidebar h2 {
                margin-top: 0;
                margin-bottom: 16px;

                font-size: 20px;
                font-weight: 600;

                color: #f0f6fc;
              }

              .sidebar ul {
                list-style: none;

                padding: 0;
                margin: 0;
              }

              .sidebar li {
                margin-bottom: 4px;
              }

              .sidebar a {
                color: #c9d1d9;

                text-decoration: none;

                padding: 8px 12px;

                display: block;

                border-radius: 6px;

                font-size: 14px;

                transition:
                  background-color 0.2s,
                  color 0.2s;
              }

              .sidebar a:hover {
                background: #21262d;
                color: #f0f6fc;
              }

              .sidebar .active a {
                background: #1f6feb;
                color: #ffffff;
                font-weight: 500;
              }

              .content {
                flex: 1;

                background: #0d1117;

                padding: 32px;

                border-radius: 6px;
                border: 1px solid #30363d;

                min-width: 0;
              }

              .markdown-body {
                color: #c9d1d9;
                font-size: 16px;
              }

              .markdown-body h1,
              .markdown-body h2,
              .markdown-body h3,
              .markdown-body h4,
              .markdown-body h5,
              .markdown-body h6 {
                color: #f0f6fc;

                font-weight: 600;

                margin-top: 24px;
                margin-bottom: 16px;

                line-height: 1.25;
              }

              .markdown-body h1 {
                font-size: 32px;

                padding-bottom: 8px;

                border-bottom: 1px solid #30363d;
              }

              .markdown-body h2 {
                font-size: 24px;

                padding-bottom: 8px;

                border-bottom: 1px solid #30363d;

                margin-top: 32px;
              }

              .markdown-body h3 {
                font-size: 20px;
              }

              .markdown-body p {
                margin-bottom: 16px;
              }

              .markdown-body a {
                color: #58a6ff;
                text-decoration: none;
              }

              .markdown-body a:hover {
                text-decoration: underline;
              }

              .markdown-body code {
                background: #161b22;

                padding: 2px 6px;

                border-radius: 3px;

                font-size: 85%;

                color: #f85149;

                border: 1px solid #30363d;
              }

              .markdown-body pre {
                background: #161b22;

                padding: 16px;

                border-radius: 6px;

                overflow-x: auto;

                border: 1px solid #30363d;
              }

              .markdown-body pre code {
                background: transparent;

                padding: 0;

                border: none;

                color: #c9d1d9;

                font-size: 85%;
              }

              .markdown-body blockquote {
                padding: 0 16px;

                color: #8b949e;

                border-left: 4px solid #30363d;

                margin: 0;
              }

              .markdown-body table {
                border-collapse: collapse;

                width: 100%;

                margin: 16px 0;
              }

              .markdown-body table th,
              .markdown-body table td {
                padding: 8px 16px;

                border: 1px solid #30363d;
              }

              .markdown-body table th {
                background: #161b22;

                font-weight: 600;

                color: #f0f6fc;
              }

              .markdown-body table tr:nth-child(2n) {
                background: #161b22;
              }

              .markdown-body ul,
              .markdown-body ol {
                padding-left: 24px;

                margin-bottom: 16px;
              }

              .markdown-body li {
                margin-bottom: 4px;
              }

              .markdown-body hr {
                height: 1px;

                background: #30363d;

                border: none;

                margin: 24px 0;
              }

              footer {
                margin-top: 48px;

                padding-top: 24px;

                border-top: 1px solid #30363d;

                color: #8b949e;

                text-align: center;

                font-size: 14px;
              }

              @media (max-width: 768px) {
                .container {
                  flex-direction: column;
                  padding: 16px;
                }

                .sidebar {
                  width: 100%;
                  position: static;
                }

                .content {
                  padding: 24px;
                }
              }
            </style>
          </head>

          <body>
            <div class="container">

              <nav class="sidebar">
                <h2>Документация</h2>

                <ul>
                  ${navigation}
                </ul>
              </nav>

              <main class="content markdown-body">
                ${content}

                <footer>
                  <p>
                    Generated on
                    ${new Date().toLocaleDateString("ru-RU")}
                  </p>
                </footer>
              </main>

            </div>
          </body>
          </html>`;
          }

          // -----------------------------------------
          // Generate pages
          // -----------------------------------------

          for (const page of pages) {
            let markdown = fs.readFileSync(
              page.source,
              "utf8"
            );

            // Markdown .md -> .html
            markdown = fixMarkdownLinks(markdown);

            // Markdown -> HTML
            let html = marked.parse(markdown);

            // Дополнительная защита после marked
            html = fixHtmlLinks(html);

            fs.mkdirSync(path.dirname(page.output), {
              recursive: true
            });

            fs.writeFileSync(
              page.output,
              createPage(
                page.title,
                html,
                page
              )
            );
          }

          // -----------------------------------------
          // Index
          // -----------------------------------------

          const indexPage = pages.find(page =>
            path.basename(page.source).toLowerCase() === "index.md"
          );

          if (indexPage) {
            const indexOutput =
              path.join(SITE_DIR, "index.html");

            let markdown = fs.readFileSync(
              indexPage.source,
              "utf8"
            );

            // FIX: index.md тоже должен получать .html
            markdown = fixMarkdownLinks(markdown);

            let html = marked.parse(markdown);

            // FIX: окончательная проверка href
            html = fixHtmlLinks(html);

            fs.writeFileSync(
              indexOutput,
              createPage(
                indexPage.title,
                html,
                indexPage
              )
            );
          } else {
            const links = pages
              .map(page => {
                const href = path
                  .relative(SITE_DIR, page.output)
                  .replace(/\\/g, "/");

                return `- [${page.title}](${href})`;
              })
              .join("\n");

            const content = marked.parse(links);

            const homePage = {
              source: "__index__",
              output: path.join(
                SITE_DIR,
                "index.html"
              )
            };

            fs.writeFileSync(
              path.join(
                SITE_DIR,
                "index.html"
              ),
              createPage(
                "Документация",
                content,
                homePage
              )
            );
          }

          // -----------------------------------------
          // GitHub Pages
          // -----------------------------------------

          fs.writeFileSync(
            path.join(SITE_DIR, ".nojekyll"),
            ""
          );

          // -----------------------------------------
          // Final validation
          // -----------------------------------------

          console.log("");
          console.log("=== Checking generated links ===");

          function findHtmlFiles(dir) {
            const result = [];

            for (const entry of fs.readdirSync(dir, {
              withFileTypes: true
            })) {
              const fullPath = path.join(
                dir,
                entry.name
              );

              if (entry.isDirectory()) {
                result.push(
                  ...findHtmlFiles(fullPath)
                );
              } else if (
                entry.isFile() &&
                entry.name.toLowerCase().endsWith(".html")
              ) {
                result.push(fullPath);
              }
            }

            return result;
          }

          const htmlFiles = findHtmlFiles(SITE_DIR);

          for (const file of htmlFiles) {
            const html = fs.readFileSync(
              file,
              "utf8"
            );

            const badLinks = html.match(
              /href="[^"]+\.md(?:#[^"]*)?"/gi
            );

            if (badLinks) {
              console.error(
                `ERROR: .md links found in ${file}:`
              );

              console.error(badLinks);

              process.exit(1);
            }
          }

          console.log("All documentation links are valid.");

          console.log("");
          console.log("=== Generated files ===");

          for (const file of htmlFiles) {
            console.log(
              path.relative(SITE_DIR, file)
            );
          }
          EOF

          node compiler.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site/"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4